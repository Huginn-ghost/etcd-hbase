        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/locked-temurin-jdk.tar.gz"
      - name: Verify the locked Temurin JDK archive checksum
        run: python3 scripts/dev/download-locked-jdk.py --verify "$RUNNER_TEMP/locked-temurin-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/locked-temurin-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J44
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m4.sh --scope public --task J44 --artifact-root ".artifacts/m4/ci-${{ github.run_id }}-${{ github.run_attempt }}"
  j45:
    if: ${{ !cancelled() }}
    name: J45 · Watch 双向流与订阅生命周期验证
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ inputs.maven_preparation_result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the locked Temurin JDK archive
        id: jdk-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/locked-temurin-jdk.tar.gz
          key: locked-jdk21-${{ runner.os }}-${{ hashFiles('build/dependency-lock.json') }}
      - name: 下载锁定的 Java 21
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/locked-temurin-jdk.tar.gz"
      - name: Verify the locked Temurin JDK archive checksum
        run: python3 scripts/dev/download-locked-jdk.py --verify "$RUNNER_TEMP/locked-temurin-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/locked-temurin-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J45
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m4.sh --scope public --task J45 --artifact-root ".artifacts/m4/ci-${{ github.run_id }}-${{ github.run_attempt }}"
  j46:
    if: ${{ !cancelled() }}
    name: J46 · Watch 回放、进度、fragment 与 Go 客户端互通验证
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ inputs.maven_preparation_result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the locked Temurin JDK archive
        id: jdk-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/locked-temurin-jdk.tar.gz
          key: locked-jdk21-${{ runner.os }}-${{ hashFiles('build/dependency-lock.json') }}
      - name: 下载锁定的 Java 21
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/locked-temurin-jdk.tar.gz"
      - name: Verify the locked Temurin JDK archive checksum
        run: python3 scripts/dev/download-locked-jdk.py --verify "$RUNNER_TEMP/locked-temurin-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/locked-temurin-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J46
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m4.sh --scope public --task J46 --artifact-root ".artifacts/m4/ci-${{ github.run_id }}-${{ github.run_attempt }}"
  j47:
    if: ${{ !cancelled() }}
    name: J47 · 流控、取消与资源排空验证
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ inputs.maven_preparation_result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the locked Temurin JDK archive
        id: jdk-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/locked-temurin-jdk.tar.gz
          key: locked-jdk21-${{ runner.os }}-${{ hashFiles('build/dependency-lock.json') }}
      - name: 下载锁定的 Java 21
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/locked-temurin-jdk.tar.gz"
      - name: Verify the locked Temurin JDK archive checksum
        run: python3 scripts/dev/download-locked-jdk.py --verify "$RUNNER_TEMP/locked-temurin-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/locked-temurin-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J47
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m4.sh --scope public --task J47 --artifact-root ".artifacts/m4/ci-${{ github.run_id }}-${{ github.run_attempt }}"

  summary:
    name: M4 · 全部验证任务汇总
    needs:
      - j40
      - j41
      - j42
      - j43
      - j44
      - j45
      - j46
      - j47
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检查全部任务均已执行并成功
        env:
          J40_RESULT: ${{ needs.j40.result }}
          J41_RESULT: ${{ needs.j41.result }}
          J42_RESULT: ${{ needs.j42.result }}
          J43_RESULT: ${{ needs.j43.result }}
          J44_RESULT: ${{ needs.j44.result }}
          J45_RESULT: ${{ needs.j45.result }}
          J46_RESULT: ${{ needs.j46.result }}
          J47_RESULT: ${{ needs.j47.result }}
        run: |
          set -u
          failed=0
          for check in \
            "j40=$J40_RESULT" \
            "j41=$J41_RESULT" \
            "j42=$J42_RESULT" \
            "j43=$J43_RESULT" \
            "j44=$J44_RESULT" \
            "j45=$J45_RESULT" \
            "j46=$J46_RESULT" \
            "j47=$J47_RESULT"
          do
            IFS='=' read -r check_id result <<< "$check"
            printf '%s: %s\n' "$check_id" "$result"
            if [[ "$result" != success ]]; then
              failed=1
            fi
          done
          exit "$failed"
