name: "M3 · KV/Range/Txn 与恢复集成"
on:
  workflow_call:
    inputs:
      maven_preparation_result:
        description: Result of the shared Maven preparation job.
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: m3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  j28-history:
    if: ${{ !cancelled() }}
    name: J28.2 · Go 客户端并发历史与进程故障恢复验证
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ inputs.maven_preparation_result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载固定 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m3-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m3-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J28.2
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m3.sh --scope public --task J28.2 --artifact-root .artifacts/m3/ci
  j30:
    if: ${{ !cancelled() }}
    name: J30 · 原生 etcd 对照、真实 HBase 与恢复验证
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ inputs.maven_preparation_result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载固定 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m3-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m3-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J30
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m3.sh --scope public --task J30 --artifact-root .artifacts/m3/ci
  j31:
    if: ${{ !cancelled() }}
    name: J31 · 事务对照、真实 HBase 与恢复验证
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ inputs.maven_preparation_result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载固定 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m3-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m3-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J31
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m3.sh --scope public --task J31 --artifact-root .artifacts/m3/ci
  j32:
    if: ${{ !cancelled() }}
    name: J32 · 嵌套事务、分页工作集与真实 HBase 验证
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ inputs.maven_preparation_result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载固定 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m3-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m3-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J32
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m3.sh --scope public --task J32 --artifact-root .artifacts/m3/ci
  j33:
    if: ${{ !cancelled() }}
    name: J33 · 删除对照、有界准备与故障恢复验证
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ inputs.maven_preparation_result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载固定 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m3-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m3-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J33
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m3.sh --scope public --task J33 --artifact-root .artifacts/m3/ci
  j34:
    if: ${{ !cancelled() }}
    name: J34 · Range 选项与原生协议对照验证
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ inputs.maven_preparation_result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载固定 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m3-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m3-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J34
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m3.sh --scope public --task J34 --artifact-root .artifacts/m3/ci
  j35:
    if: ${{ !cancelled() }}
    name: J35 · 全局升降序与反向存储扫描验证
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ inputs.maven_preparation_result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载固定 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m3-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m3-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J35
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m3.sh --scope public --task J35 --artifact-root .artifacts/m3/ci

  summary:
    name: M3 · 全部验证任务汇总
    needs:
      - j28-history
      - j30
      - j31
      - j32
      - j33
      - j34
      - j35
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检查全部任务均已执行并成功
        env:
          J28_HISTORY_RESULT: ${{ needs.j28-history.result }}
          J30_RESULT: ${{ needs.j30.result }}
          J31_RESULT: ${{ needs.j31.result }}
          J32_RESULT: ${{ needs.j32.result }}
          J33_RESULT: ${{ needs.j33.result }}
          J34_RESULT: ${{ needs.j34.result }}
          J35_RESULT: ${{ needs.j35.result }}
        run: |
          set -u
          failed=0
          for check in \
            "j28-history=$J28_HISTORY_RESULT" \
            "j30=$J30_RESULT" \
            "j31=$J31_RESULT" \
            "j32=$J32_RESULT" \
            "j33=$J33_RESULT" \
            "j34=$J34_RESULT" \
            "j35=$J35_RESULT"
          do
            IFS='=' read -r check_id result <<< "$check"
            printf '%s: %s\n' "$check_id" "$result"
            if [[ "$result" != success ]]; then
              failed=1
            fi
          done
          exit "$failed"
