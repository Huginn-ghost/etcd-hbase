name: "J09 · 公开构建、运行包与镜像验证"

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: j09-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-delivery:
    name: J09 · 公开构建、运行包与容器镜像验证
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 缓存 Maven Wrapper 发行包
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.m2/wrapper/dists
          key: j09-maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Restore the locked Temurin JDK archive
        id: jdk-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/locked-temurin-jdk.tar.gz
          key: locked-jdk21-${{ runner.os }}-${{ hashFiles('build/dependency-lock.json') }}
      - name: 下载固定 Temurin JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/locked-temurin-jdk.tar.gz"
      - name: Verify the locked Temurin JDK archive checksum
        run: python3 scripts/dev/download-locked-jdk.py --verify "$RUNNER_TEMP/locked-temurin-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/locked-temurin-jdk.tar.gz
      - name: 完整公开验证及索引复核
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: |
          scripts/verify/m0.sh --scope public --artifact-root .artifacts/m0/public/ci
          python3 scripts/verify/report-index.py --phase M0 --artifact-root .artifacts/m0/public/ci
      - name: 上传 J09 失败诊断
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j09-failure-diagnostics-${{ github.run_id }}
          path: |
            .artifacts/m0/public/ci/INDEX.json
            .artifacts/m0/public/ci/steps.json
            .artifacts/m0/public/ci/summary.json
            .artifacts/m0/public/ci/reproducible.log
            .artifacts/m0/public/ci/go-race.jsonl
            .artifacts/m0/public/ci/reproducible/maven-wrapper-startup-*.log
            .artifacts/m0/public/ci/reproducible/run-*/maven.log
          if-no-files-found: warn
          retention-days: 7
